# Disposable database for integration tests; never connect CI to production.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: gamematch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GM_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/gamematch_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create test-only database roles
        run: |
          PGPASSWORD=test-only psql -h localhost -U postgres -d gamematch_test -c "CREATE ROLE anon; CREATE ROLE authenticated;"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
